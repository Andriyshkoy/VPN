name: Hysteria runtime

on:
  pull_request:
    branches: [main]
    paths:
      - apps/hysteria-runtime/**
      - .github/workflows/hysteria-runtime.yml
  push:
    branches: [main]
    paths:
      - apps/hysteria-runtime/**
      - .github/workflows/hysteria-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hysteria-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hysteria-runtime:
    name: Compatibility runtime and deterministic artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hysteria-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/hysteria-runtime/requirements.lock
      - name: Install isolated runtime dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Test authentication, BSON and collector replay
        run: python -m unittest discover -s tests -v
      - name: Check dependencies and compile runtime
        run: |
          python -m pip check
          python -m compileall -q hysteria_runtime build_artifact.py
      - name: Build deterministic native artifact
        run: python build_artifact.py --output-dir dist
      - name: Upload immutable runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hysteria-runtime-${{ github.sha }}
          path: apps/hysteria-runtime/dist/*
          if-no-files-found: error
          retention-days: 30
